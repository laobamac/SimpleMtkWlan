name: Build kext

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-kext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SimpleMtkWlan.kext (x86_64)
    # Pinned on purpose: macos-latest moved to macOS 26, the target here is Sequoia (macOS 15).
    # The runner is Apple Silicon, so x86_64 is forced below (the Hackintosh is x86_64).
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Environment diagnostics
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks
          ls -d /Applications/Xcode* || true
          xcodebuild -list -project SimpleMtkWlan.xcodeproj

      - name: Build kext
        run: |
          set -o pipefail
          xcodebuild \
            -project SimpleMtkWlan.xcodeproj \
            -scheme SimpleMtkWlan \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            build 2>&1 | tee build.log

      - name: Package and inspect
        run: |
          test -d build/SimpleMtkWlan.kext
          find build/SimpleMtkWlan.kext -type f -path '*/Contents/MacOS/*' -exec lipo -info {} \;
          plutil -p build/SimpleMtkWlan.kext/Contents/Info.plist | head -n 40
          ditto -c -k --keepParent build/SimpleMtkWlan.kext SimpleMtkWlan.kext.zip
          shasum -a 256 SimpleMtkWlan.kext.zip | tee SimpleMtkWlan.kext.zip.sha256

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMtkWlan-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            SimpleMtkWlan.kext.zip
            SimpleMtkWlan.kext.zip.sha256
            build.log
          if-no-files-found: warn
          retention-days: 30